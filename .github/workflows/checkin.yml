# Runs the Scheduled Check-In Bot automatically, so it can act on a
# schedule even when nobody is at the keyboard.
#
# Two things have to be true for this to work:
#   1. GitHub has to start it for us   -> the `schedule` trigger below
#   2. it has to reach the API as me   -> the PRACTICE_API_TOKEN secret,
#      which the `env:` block passes into the script's environment

name: Scheduled Check-In Bot

# `on:` lists every event that is allowed to start this workflow.
on:
  # `schedule` runs the workflow on a timetable, GitHub's side.
  schedule:
    # GitHub cron expressions have five fields, all in UTC:
    #   minute  hour  day-of-month  month  day-of-week
    # "41 */2 * * *" = minute 41, every 2nd hour, every day of every month.
    #
    # Why every 2 hours: check-in posts only accept replies inside a time
    # window, and the API never tells us when that window opens — it just
    # rejects replies with 423 when it is closed. Running often means the
    # bot never goes more than ~2 hours without looking, so any window
    # longer than that is guaranteed to be caught.
    #
    # Why minute 41 and not 0: GitHub runs every user's cron on the same
    # clocks, so :00 minutes are crowded and delayed. An off-peak minute
    # makes delayed starts less likely.
    #
    # (UTC is 5-6 hours ahead of Central time, so these fire at odd local
    # hours — that is fine, the bot does the checking for us.)
    - cron: "41 */2 * * *"

  # `workflow_dispatch` adds a "Run workflow" button on the Actions tab,
  # so the same job can also be started by hand — for testing a change
  # without waiting for the next scheduled slot.
  workflow_dispatch:

# Least privilege: the job gets write access to the repo contents (the
# bot commits its artifact/ folder back to this repository) and nothing else.
permissions:
  contents: write

# Only one run of this workflow may be active at a time. Without this,
# a delayed cron run could overlap a manual one, and both would try to
# git push the artifact/ folder — the loser's push would fail the run.
# Any run queued behind the active one waits its turn; cancel-in-progress
# goes further and stops a run that is mid-flight when a newer one starts,
# so the newest run's data is what gets committed.
concurrency:
  group: checkin
  cancel-in-progress: true

jobs:
  checkin:
    # GitHub-hosted virtual machine the steps below run on.
    runs-on: ubuntu-latest
    # Hard stop for the whole job — every HTTP call in the bot has its own
    # 30-second timeout, but this is the backstop so a wedged run can
    # never sit on a runner indefinitely.
    timeout-minutes: 10

    steps:
      # Clones this repository into the runner, so the script and the
      # workflow file itself are on disk for later steps. It also leaves a
      # short-lived GITHUB_TOKEN in .git/config, which is what lets the
      # last step push the artifact back.
      - uses: actions/checkout@v4

      # Installs Python on the runner — the VM is otherwise bare.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Installs the dependencies the script imports (just `requests`
      # for now) from the committed requirements list.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Runs the bot. The secrets never appear in this file — they are
      # stored under Settings → Secrets and variables → Actions, and
      # `${{ secrets.NAME }}` substitutes them in only at run time.
      # Mapping them into `env:` hands them to the script the same way
      # an exported shell variable would, so the code reads them with
      # plain os.environ.get() and the token never gets committed.
      # GitHub also masks secret values in the run logs, so an accidental
      # print of one shows up as "***".
      - name: Run bot
        env:
          PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
          PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
          INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
        run: python checkin_bot.py

      # The bot just wrote the instructor's latest posts and files into
      # artifact/ — on the runner's disk, which GitHub throws away when
      # the job ends. The assignment is graded from the repo, so this step
      # commits the artifact folder back to main before that happens.
      - name: Commit artifact back to the repo
        run: |
          # The runner has no git identity configured; give the commit the
          # conventional bot name so history clearly shows what was
          # automated vs. hand-pushed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/

          # A re-run where the instructor posted nothing new has nothing
          # staged. git diff --staged --quiet exits 0 exactly then, so
          # skip the commit AND the push — a clean run should leave the
          # repo untouched instead of pushing a no-op.
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi

          git commit -m "Update artifact: $(date -u +%Y-%m-%d) run [skip ci]"

          # main may have moved since our checkout — a hand-pushed commit,
          # or an artifact commit from a run that finished while this one
          # was waiting on the concurrency group. Replaying our one
          # artifact commit on top of the latest remote state is what
          # makes the push below land instead of being rejected with
          # "fetch first".
          if ! git pull --rebase origin main; then
            # A conflict can only be inside artifact/ — the only path the
            # bot ever commits — and this run regenerated the whole
            # folder, so our copy is the freshest. Undo the tangled
            # rebase, snap to the latest remote state, and replace its
            # artifact with an exact copy of ours before committing again.
            git rebase --abort
            OUR_COMMIT=$(git rev-parse HEAD)
            git reset --hard origin/main
            git rm -r -q --ignore-unmatch artifact/
            git checkout "$OUR_COMMIT" -- artifact/
            git commit -m "Update artifact: $(date -u +%Y-%m-%d) run (rebased) [skip ci]"
          fi

          # [skip ci] in the messages above tells GitHub to never launch
          # workflows from these pushes, so the bot's own commits cannot
          # trigger the bot again.
          git push